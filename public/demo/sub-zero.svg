  <circle cx="256" cy="250" r="110" fill="#7c3aed" opacity="0.18" filter="url(#soft)"/>
  <g filter="url(#glow)" fill="url(#wave)">
    <rect x="168" y="238" width="16" height="64" rx="8"/>
    <rect x="196" y="212" width="16" height="116" rx="8"/>
    <rect x="224" y="178" width="16" height="184" rx="8" opacity="0.9"/>
    <rect x="252" y="146" width="16" height="248" rx="8"/>
    <rect x="280" y="188" width="16" height="164" rx="8"/>
    <rect x="308" y="218" width="16" height="104" rx="8" opacity="0.9"/>
    <rect x="336" y="246" width="16" height="48" rx="8" opacity="0.8"/>
  </g>
  <g fill="#ffffff" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
